name = "YouTube"
package = "com.google.android.youtube"
sources = ["morphe"]

[download]
apkmirror = "google-inc/youtube"
uptodown = "youtube"

# Stock name and icon. Morphe otherwise names the app "YouTube Morphe" in system settings and
# notifications and shows its own icon there; the in-app branding setting only reaches the launcher.
[patches]
enable = ["Custom branding"]
options = { appIcon = "original", customName = "YouTube" }
